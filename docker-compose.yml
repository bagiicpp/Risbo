services:
  mongodb:
    image: mongo:7
    container_name: rizzbo-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: rizzbo
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

  ai-backend:
    build:
      context: ./ai-backend
    container_name: rizzbo-ai
    ports:
      - "8000:8000"
    env_file:
      - ./ai-backend/.env

  app-backend:
    build:
      context: ./app-backend
    container_name: rizzbo-app
    ports:
      - "8080:8080"
    environment:
      # Point to the AI container, not localhost
      - AI_BACKEND_URL=http://ai-backend:8000
      # Point to the Mongo container, not localhost
      - MONGODB_URI=mongodb://mongodb:27017/rizzbo
      - JWT_SECRET_KEY=JjqFPLGx6GUU1gboqJtMlGq4pqXCg5DEVpISfEBY1v4
    depends_on:
      mongodb:
        condition: service_healthy
      ai-backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: rizzbo-frontend
    ports:
      - "5173:5173"
    environment:
      # If your React app needs to know where the backend is via an env variable, add it here.
      # e.g., VITE_API_URL=http://localhost:8080
      # (Note: Frontend envs keep localhost because the browser makes the request, not the container)
      - WATCHPACK_POLLING=true # Helps Vite hot-reload work properly inside Docker
    depends_on:
      - app-backend

volumes:
  mongo_data:
