services:
  mongodb:
    image: mongo:7
    container_name: rizzbo-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: rizzbo
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

  searxng:
    image: searxng/searxng:latest
    container_name: rizzbo-searxng
    ports:
      - "8888:8080"
    volumes:
      - ./searxng/core-config:/etc/searxng:rw
    restart: unless-stopped

  ai-backend:
    build:
      context: ./ai-backend
    container_name: rizzbo-ai
    ports:
      - "8000:8000"
    env_file:
      - ./ai-backend/.env
    environment:
      - SEARXNG_URL=http://searxng:8080
    volumes:
      - ./ai-backend:/app
    depends_on:
      - searxng
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  app-backend:
    build:
      context: ./app-backend
    container_name: rizzbo-app
    ports:
      - "8080:8080"
    environment:
      - AI_BACKEND_URL=http://ai-backend:8000
      - MONGODB_URI=mongodb://mongodb:27017/rizzbo
    env_file:
      - ./app-backend/.env
    volumes:
      - ./app-backend:/app
    depends_on:
      mongodb:
        condition: service_healthy
      ai-backend:
        condition: service_started
    command: uvicorn main:app --host 0.0.0.0 --port 8080 --reload

  frontend:
    build:
      context: ./frontend
    container_name: rizzbo-frontend
    ports:
      - "5173:5173"
    environment:
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - app-backend

volumes:
  mongo_data:
