name: Render Service Schedule

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Force action (ili ostavi auto za time-based logiku)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - resume
          - suspend

jobs:
  toggle-service:
    runs-on: ubuntu-latest
    steps:
      - name: Determine action
        id: action
        run: |
          INPUT_ACTION="${{ github.event.inputs.action }}"
          if [ -n "$INPUT_ACTION" ] && [ "$INPUT_ACTION" != "auto" ]; then
            echo "action=$INPUT_ACTION" >> $GITHUB_OUTPUT
            echo "Manual override: $INPUT_ACTION"
            exit 0
          fi

          HOUR=$(TZ=Europe/Belgrade date +%H)
          echo "Trenutno beogradsko vreme: $HOUR:xx"
          if [ "$HOUR" = "08" ]; then
            echo "action=resume" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "20" ]; then
            echo "action=suspend" >> $GITHUB_OUTPUT
          else
            echo "action=skip" >> $GITHUB_OUTPUT
            echo "Nije 08:xx ni 20:xx. Preskacem izvršavanje."
          fi

      - name: Resume services
        if: steps.action.outputs.action == 'resume'
        run: |
          echo "Resuming AI Service..."
          RESPONSE_AI=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_AI_ID }}/resume" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json")
          echo "$RESPONSE_AI"
          if [[ "$RESPONSE_AI" != *"HTTP_STATUS:202"* && "$RESPONSE_AI" != *"HTTP_STATUS:200"* ]]; then 
            echo "Kritična greška: Render API odbio zahtev za AI Service."
            exit 1
          fi

          echo "Resuming SPP Service..."
          RESPONSE_APP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_APP_ID }}/resume" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json")
          echo "$RESPONSE_APP"
          if [[ "$RESPONSE_APP" != *"HTTP_STATUS:202"* && "$RESPONSE_APP" != *"HTTP_STATUS:200"* ]]; then 
            echo "Kritična greška: Render API odbio zahtev za SPP Service."
            exit 1
          fi

      - name: Suspend services
        if: steps.action.outputs.action == 'suspend'
        run: |
          echo "Suspending AI Service..."
          RESPONSE_AI=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_AI_ID }}/suspend" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json")
          echo "$RESPONSE_AI"
          if [[ "$RESPONSE_AI" != *"HTTP_STATUS:202"* && "$RESPONSE_AI" != *"HTTP_STATUS:200"* ]]; then 
            echo "Kritična greška: Render API odbio zahtev za AI Service."
            exit 1
          fi

          echo "Suspending SPP Service..."
          RESPONSE_APP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_APP_ID }}/suspend" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json")
          echo "$RESPONSE_APP"
          if [[ "$RESPONSE_APP" != *"HTTP_STATUS:202"* && "$RESPONSE_APP" != *"HTTP_STATUS:200"* ]]; then 
            echo "Kritična greška: Render API odbio zahtev za SPP Service."
            exit 1
          fi
